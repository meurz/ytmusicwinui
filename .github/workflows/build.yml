name: Build Windows packages
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore, build and publish
        shell: pwsh
        run: ./scripts/build.ps1 -Architecture ${{ matrix.architecture }} -Publish
      - name: Verify published language resources
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          $app = (Resolve-Path 'artifacts/ytmusicwinui-win-x64/ytmusicwinui.exe').Path
          $process = Start-Process -FilePath $app -ArgumentList '--verify-localization' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Published PRI localization verification failed.' }
      - name: Run application tests
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          dotnet run --project tests/CoreContractChecks/CoreContractChecks.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Application contract checks failed.' }
      - name: Compile opt-in playback check
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: dotnet build tests/PlaybackSmoke/PlaybackSmoke.csproj --configuration Release
      - name: Create portable archive
        shell: pwsh
        run: |
          $name = 'ytmusicwinui-win-${{ matrix.architecture }}'
          Compress-Archive -Path "artifacts/$name/*" -DestinationPath "artifacts/$name.zip"
          $hash = (Get-FileHash "artifacts/$name.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name.zip" | Set-Content "artifacts/$name.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ytmusicwinui-win-${{ matrix.architecture }}
          path: |
            artifacts/ytmusicwinui-win-${{ matrix.architecture }}.zip
            artifacts/ytmusicwinui-win-${{ matrix.architecture }}.sha256
          if-no-files-found: error
